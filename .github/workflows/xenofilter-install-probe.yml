name: XenofilteR install probe (temporary)

# Temporary diagnostic for the "there is no package called 'GenomeInfoDbData'" failure:
# inspect the R library paths of the analysis environment and test whether installing the
# data package from Bioconductor source unblocks `R CMD INSTALL XenofilteR`.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ENVA_COMMIT: bdea477885a90dec16874351a9f572feb8298a55
  XENOFILTER_COMMIT: de0bbe4c706766702b0fe15a676893639f96d50d

jobs:
  probe:
    name: R library diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout xenofilx
        uses: actions/checkout@v4

      - name: Checkout pinned enva
        uses: actions/checkout@v4
        with:
          repository: rainoffallingstar/enva
          ref: ${{ env.ENVA_COMMIT }}
          path: .ci/enva

      - name: Checkout pinned XenofilteR source
        uses: actions/checkout@v4
        with:
          repository: PeeperLab/XenofilteR
          ref: ${{ env.XENOFILTER_COMMIT }}
          path: .ci/XenofilteR

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build enva
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs
          (cd .ci/enva && cargo build --release --locked --bin enva) 2>&1 | tee ci-artifacts/logs/enva-build.log

      - name: Create the analysis environment through enva
        env:
          RATTLER_CACHE_DIR: ${{ runner.temp }}/rattler-cache
        run: |
          set -euo pipefail
          mkdir -p "$RATTLER_CACHE_DIR"
          cat > ci-artifacts/probe-analysis.yaml <<'YAML'
          channels:
            - conda-forge
            - bioconda
          dependencies:
            - samtools=1.15.1
            - picard=3.4.0
            - r-base=4.3
            - bioconductor-biocparallel
            - bioconductor-genomicalignments
            - bioconductor-genomeinfodb
            - bioconductor-genomeinfodbdata
            - bioconductor-genomicranges
            - bioconductor-iranges
            - bioconductor-s4vectors
            - bioconductor-rsamtools
            - r-futile.logger
            - r-jsonlite
          YAML
          .ci/enva/target/release/enva create \
            --yaml ci-artifacts/probe-analysis.yaml \
            --name probe-analysis \
            --force \
            --output summary \
            2>&1 | tee ci-artifacts/logs/enva-create.log

      - name: Inspect the R library
        run: |
          set -euo pipefail
          .ci/enva/target/release/enva run --name probe-analysis \
            --command "Rscript -e 'cat(\"R: \", R.version.string, \"\n\"); print(.libPaths()); ip <- rownames(installed.packages()); cat(\"Genome packages:\n\"); print(ip[grepl(\"Genome\", ip)])'" \
            2>&1 | tee ci-artifacts/logs/r-library.log
          .ci/enva/target/release/enva run --name probe-analysis \
            --command "ls -1 \"\$CONDA_PREFIX/lib/R/library\" | grep -i genome" \
            2>&1 | tee ci-artifacts/logs/r-library-files.log || true

      - name: Try the install as-is
        run: |
          set -euo pipefail
          .ci/enva/target/release/enva run --name probe-analysis \
            --command "R CMD INSTALL '$GITHUB_WORKSPACE/.ci/XenofilteR'" \
            2>&1 | tee ci-artifacts/logs/install-as-is.log || echo "INSTALL_AS_IS_FAILED"

      - name: Try installing the data package from source
        run: |
          set -euo pipefail
          .ci/enva/target/release/enva run --name probe-analysis \
            --command "Rscript -e 'options(repos=c(CRAN=\"https://cloud.r-project.org\")); if (!requireNamespace(\"BiocManager\", quietly=TRUE)) install.packages(\"BiocManager\"); BiocManager::install(\"GenomeInfoDbData\", ask=FALSE, update=FALSE)'" \
            2>&1 | tee ci-artifacts/logs/install-biocmanager.log || echo "BIOCMANAGER_FAILED"
          .ci/enva/target/release/enva run --name probe-analysis \
            --command "R CMD INSTALL '$GITHUB_WORKSPACE/.ci/XenofilteR'" \
            2>&1 | tee ci-artifacts/logs/install-after-source.log || echo "INSTALL_AFTER_SOURCE_FAILED"

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xenofilter-install-probe
          path: ci-artifacts/logs/
          if-no-files-found: warn
          retention-days: 3
