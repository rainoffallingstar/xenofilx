name: xenofilx CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-bam-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run Go quality gates
        run: |
          go mod download
          go test -count=1 ./...
          go vet ./...
          # Race detector is slow on bamnative real-BAM tests; use -short to
          # skip TestBGZFReaderPosition (50+ seconds alone under race) while
          # still exercising all correctness and concurrency assertions.
          go test -race -count=1 -short ./...

      - name: Run vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Install samtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y samtools

      - name: Build xenofilx
        run: |
          CGO_ENABLED=0 go build -o ./xenofilx ./cmd/xenofilx

      - name: BAM compatibility gate
        run: |
          set -euo pipefail
          GRAFT="testdata/Test_hg19_NRAS.bam"
          HOST="testdata/Test_mm10_NRAS.bam"
          OUT_DIR="$(mktemp -d)"

          samtools quickcheck "$GRAFT" "$HOST"
          samtools view -H "$GRAFT" >/dev/null
          samtools view -c "$GRAFT" >/dev/null

          ./xenofilx run --graft "$GRAFT" --host "$HOST" --output "$OUT_DIR" --threads 1

          OUT_BAM="$OUT_DIR/Test_hg19_NRAS_Filtered.bam"
          test -f "$OUT_BAM"
          test -f "$OUT_BAM.bai"
          samtools quickcheck "$OUT_BAM"
          samtools view -H "$OUT_BAM" >/dev/null
          samtools view -c "$OUT_BAM" >/dev/null
          samtools view -H "$OUT_BAM" | awk '$1 == "@HD" && $0 !~ /SO:coordinate/ { exit 1 }'
          FIRST_REF="$(samtools view -H "$OUT_BAM" | awk '$1 == "@SQ" { sub(/^SN:/, "", $2); print $2; exit }')"
          test -n "$FIRST_REF"
          samtools view "$OUT_BAM" "${FIRST_REF}:1-1000000" >/dev/null
